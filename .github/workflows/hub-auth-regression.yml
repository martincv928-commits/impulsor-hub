name: Hub authentication regression
on:
  push:
    branches: [master]
    paths: ['app/api/main.py', 'app/core/security.py', 'app/core/ui_*.py', 'ui/**', '.devcontainer/**', 'tests/*hub*', 'tests/test_security.py', 'tests/test_cloud_session.py', '.github/workflows/hub-auth-regression.yml']
  pull_request:
    paths: ['app/api/main.py', 'app/core/security.py', 'app/core/ui_*.py', 'ui/**', '.devcontainer/**', 'tests/*hub*', 'tests/test_security.py', 'tests/test_cloud_session.py', '.github/workflows/hub-auth-regression.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci && VITE_DEMO_MODE=false BUILD_BASE_PATH=/ npm run build
        working-directory: ui
      - run: bash -n .devcontainer/start-hub.sh
      - run: python -m unittest discover -s tests -p test_hub_auth_regression.py -v
      - run: python -m pytest tests/test_security.py tests/test_cloud_session.py -q
