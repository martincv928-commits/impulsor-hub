name: Block Forge V0.9 APK

on:
  workflow_dispatch:
  push:
    branches: [block-forge-build-v09, claude/new-session-9jvn1h]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Block Forge source
        run: |
          rm -rf blockforge-build
          mkdir blockforge-build
          unzip -q blockforge-v09-public.zip -d blockforge-build
          # Auto-increment: every build gets a higher versionCode so it installs as an update
          VC=$(( ${{ github.run_number }} + 1 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          sed -i "s/versionCode 8; versionName '0.8'/versionCode $VC; versionName '0.$VC'/" blockforge-build/app/build.gradle
          grep -q "versionCode $VC;" blockforge-build/app/build.gradle
          sed -i "s/>V0\.8 · NUEVA FORJA</>V0.$VC · NUEVA FORJA</" blockforge-build/app/src/main/assets/www/index.html
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > blockforge-build/gradle.properties

      - name: Build release APK
        working-directory: blockforge-build
        run: gradle assembleRelease

      - name: Sign APK with original Block Forge key
        env:
          KEYSTORE_B64: ${{ secrets.BLOCKFORGE_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.BLOCKFORGE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > blockforge.keystore
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$(find blockforge-build/app/build/outputs/apk/release -name '*unsigned*.apk' -o -name 'app-release.apk' | head -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "BLOCK_FORGE_V0.${VC}_ALIGNED.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks blockforge.keystore \
            --ks-key-alias blockforge \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "BLOCK_FORGE_V0.${VC}.apk" \
            "BLOCK_FORGE_V0.${VC}_ALIGNED.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "BLOCK_FORGE_V0.${VC}.apk"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK_FORGE_V0.${{ env.VC }}_SIGNED
          path: BLOCK_FORGE_V0.${{ env.VC }}.apk
