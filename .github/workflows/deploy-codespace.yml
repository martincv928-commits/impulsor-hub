name: Deploy Hub to existing Codespace
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-codespace.yml'
      - '.github/impulsor-deploy.pub'
      - 'scripts/codespace_deploy*.py'
concurrency:
  group: hub-existing-codespace-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'martincv928-commits/impulsor-hub' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate deployment safeguards
        run: python -m unittest discover -s tests -p test_codespace_deploy.py -v
      - name: Authorize, deploy and verify the existing Codespace
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: python scripts/codespace_deploy.py
