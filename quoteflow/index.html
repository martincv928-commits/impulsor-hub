  <meta name="theme-color" content="#2743B8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QuoteFlow">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/jspdf.umd.min.js"></script>

  <script src="src/share.js?v=0.4.5"></script>
  <script src="src/app.js?v=0.4.5"></script>
  <script>
    // Registra el service worker para poder instalar la app y usarla sin conexión.
    // Si falla (navegador viejo, http sin https), la app sigue funcionando normal.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
