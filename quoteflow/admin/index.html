<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16211C">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QF Admin">
  <title>QuoteFlow Admin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../src/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="../vendor/supabase.umd.js"></script>
  <script src="../src/config.js?v=0.3.7"></script>
  <script src="../src/cloud.js?v=0.3.7"></script>
  <script src="admin.js?v=0.3.7"></script>
  <script src="app.js?v=0.3.7"></script>
  <script>
    // Igual que la app principal: revisa versión nueva al volver a la
    // pestaña y se recarga sola en cuanto hay una, sin depender de borrar
    // caché a mano.
    if ('serviceWorker' in navigator) {
      // Solo recargar en una actualización real (ya había un service worker
      // controlando antes); el primer "controllerchange" de una instalación
      // nueva no debe recargar nada.
      let hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) { hadController = true; return; }
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');
          reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        } catch (e) { /* navegador viejo o sin https */ }
      });
    }
  </script>
</body>
</html>
