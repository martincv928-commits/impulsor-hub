server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend routes already include the /api prefix themselves (see
    # app/api/routers/*.py), so this must NOT rewrite/strip the path --
    # mirrors the Vite dev server's `/api` proxy behavior exactly.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
