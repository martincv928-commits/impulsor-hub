ext {
    // Google Play Protect (protección automática) exige mínimo 24; antes
    // quedó en 22 (el default de la plantilla de Capacitor) y Play Console
    // rechazó la subida por eso.
    minSdkVersion = 24
    // Play Console exige apuntar al menos a API 36 (Android 16) para subir
    // versiones nuevas; antes quedó en 34 (el default de la plantilla).
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}